<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iCode Talents</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%239470c4'/%3E%3Ctext x='16' y='22' font-size='17' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
  <header class="application-bar">
    <strong>iCode <span>Talents</span></strong>
    <div class="role-switch" role="group" aria-label="入口">
      <button data-action="switch-role" data-role="admin">管理员端</button>
      <button data-action="switch-role" data-role="dev">开发者端</button>
    </div>
    <span class="spacer"></span>
    <span class="who" data-who></span>
    <label class="theme-control">主题
      <select id="theme" aria-label="主题"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select>
    </label>
    <div class="menu-wrap">
      <button class="icon-button" data-action="toggle-menu" aria-label="更多" aria-haspopup="true">⋯</button>
      <div class="menu" data-menu hidden><button data-action="reset-demo">重置数据</button></div>
    </div>
  </header>
  <div class="shell-body">
    <aside class="sidebar">
      <div class="workspace"><span class="workspace-icon" aria-hidden="true">T</span><div><strong data-team></strong><small data-role-label></small></div></div>
      <nav aria-label="主导航" data-nav-list></nav>
    </aside>
    <main>
      <div class="breadcrumb" data-breadcrumb></div>
      <div id="app" class="page"></div>
    </main>
  </div>
</div>
<div id="layer"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="vendor/marked.umd.js"></script>
<script src="js/content.js"></script>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/knowledge.js"></script>
<script src="js/pages/sources.js"></script>
<script src="js/pages/capabilities.js"></script>
<script src="js/pages/tasks.js"></script>
<script src="js/pages/review.js"></script>
<script src="js/pages/dev-knowledge.js"></script>
<script src="js/pages/dev-local.js"></script>
<script src="js/main.js"></script>
</body>
</html>
